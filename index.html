<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#001a79">
<meta name="description" content="Mobile Applications MCQ practice: 12 individual quizzes, 120 practice questions, and a 40-question mock exam.">
<title>Mobile Applications · MCQ Practice</title>
<style>
:root {
  --navy:#001a79; --navy-deep:#061a51; --teal:#005b5e; --teal-deep:#004447; --orange:#ff791e; --blue:#7bb9cb;
  --bg:#f4f7fa; --paper:#ffffff; --ink:#15273a; --muted:#52657b; --border:#d9e3ea; --soft:#eaf4f6;
  --success:#116349; --success-bg:#e6f6ee; --error:#a32d36; --error-bg:#fff1f0;
  --shadow:0 14px 38px rgba(18, 43, 69, .055);
}
*{box-sizing:border-box}html{scroll-behavior:auto}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button,input{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.43}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--orange);outline-offset:3px}
a{color:var(--navy)}a:hover{color:var(--teal)}
.app-shell{display:grid;grid-template-columns:263px minmax(0,1fr);min-height:100vh}
.sidebar{background:var(--navy-deep);color:#fff;padding:23px 15px 24px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:13px;margin:0 9px 21px;padding-bottom:21px;border-bottom:1px solid rgba(255,255,255,.15)}
.mark{display:grid;grid-template-columns:repeat(2,8px);grid-template-rows:repeat(2,8px);gap:4px;align-content:center;justify-content:center;flex:0 0 43px;width:43px;height:43px;border-radius:12px;background:#fff}
.mark i{background:var(--teal);border-radius:2px}.mark i:nth-child(2){background:var(--orange)}.mark i:nth-child(3){background:var(--blue)}.mark i:nth-child(4){background:var(--navy)}
.brand strong{display:block;font-size:14px;line-height:1.3}.brand small{display:block;font-size:12px;color:#b3cbe5;margin-top:2px}
.nav-button{display:flex;align-items:center;gap:11px;border:0;border-radius:11px;padding:11px 12px;width:100%;text-align:left;background:transparent;color:#e5eefc;font-size:13px;font-weight:650;transition:background .15s}
.nav-button:hover{background:rgba(255,255,255,.11)}.nav-button.active{background:#2c478b;color:#fff;box-shadow:inset 3px 0 var(--orange)}
.nav-button .symbol{display:grid;place-items:center;min-width:25px;height:24px;border-radius:7px;background:rgba(255,255,255,.12);font-size:12px;font-weight:800}
.nav-button.active .symbol{background:#e6f6fa;color:var(--navy)}
.nav-label{padding:19px 12px 7px;color:#97bbd5;font-weight:850;font-size:10px;text-transform:uppercase;letter-spacing:.15em}
.nav-button .nav-text{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
main{width:100%;max-width:1260px;margin:0 auto;padding:32px clamp(20px,3.6vw,52px) 85px}main.is-answering{padding-bottom:100vh}
.topline{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:22px}
.eyebrow{font-size:11px;letter-spacing:.145em;text-transform:uppercase;font-weight:900;color:var(--teal)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border:1px solid transparent;border-radius:10px;padding:11px 16px;font-size:13px;font-weight:800;min-height:40px;white-space:nowrap;transition:background .12s,transform .12s}
.btn:not(:disabled):active{transform:translateY(1px)}.btn-primary{background:var(--navy);color:#fff}.btn-primary:hover{background:#13349f}
.btn-teal{background:var(--teal);color:#fff}.btn-teal:hover{background:var(--teal-deep)}
.btn-light{background:#fff;color:var(--navy)}.btn-light:hover{background:#e7f6fc}
.btn-outline{background:var(--paper);color:var(--navy);border-color:#cbd9e4}.btn-outline:hover{background:#ecf5fa}
.btn-danger{background:#fff;color:var(--error);border-color:#eac6c6}.btn-danger:hover{background:#fff2f1}
.btn-small{padding:8px 12px;font-size:12px;min-height:35px}
.hero{position:relative;overflow:hidden;border-radius:22px;padding:clamp(25px,4.7vw,47px);color:white;background:linear-gradient(116deg,var(--navy) 0%,#073988 65%,var(--teal) 140%);box-shadow:var(--shadow)}
.hero:after{content:"";width:350px;height:350px;position:absolute;right:-150px;top:-195px;border:65px solid rgba(123,185,203,.20);border-radius:50%;pointer-events:none}
.hero:before{content:"";width:75px;height:6px;border-radius:20px;position:absolute;left:clamp(25px,4.7vw,47px);top:22px;background:var(--orange)}
.hero-label{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.15em;color:#b7e6e7;margin-top:6px}
.hero h1{max-width:720px;font-size:clamp(28px,4.5vw,47px);line-height:1.13;letter-spacing:-.047em;margin:13px 0 15px}
.hero p{font-size:15px;line-height:1.75;color:#e2effa;max-width:580px;margin:0 0 23px}
.hero-actions{display:flex;flex-wrap:wrap;gap:9px}
.section{margin-top:34px}.section-heading{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px;margin-bottom:16px}
.section-heading h2{font-size:21px;letter-spacing:-.03em;margin:0}.subtext{font-size:13px;color:var(--muted);margin:4px 0 0}
.section-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}
.section-card,.quiz-card,.mock-card,.question-panel,.progress-panel,.result-panel,.review-card{background:var(--paper);border:1px solid var(--border);box-shadow:var(--shadow);border-radius:15px}
.section-card{padding:19px;display:flex;flex-direction:column;align-items:flex-start;min-height:195px}
.section-card .smalltag{font-size:10px;color:var(--teal);text-transform:uppercase;letter-spacing:.11em;font-weight:900}
.section-card h3{font-size:17px;line-height:1.27;margin:10px 0 9px;letter-spacing:-.02em}
.section-card p{font-size:12px;color:var(--muted);margin:0 0 17px}.section-card .btn{margin-top:auto}
.quiz-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.quiz-card{padding:15px 17px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.quiz-card strong{display:block;font-size:14px;line-height:1.35}.quiz-card p{font-size:12px;margin:5px 0 0;color:var(--muted)}
.mock-card{display:flex;gap:20px;align-items:center;justify-content:space-between;padding:22px 24px;border-left:5px solid var(--orange)}
.mock-card h3{margin:0;font-size:18px}.mock-card p{margin:5px 0 0;color:var(--muted);font-size:13px}
.quiz-header{display:flex;align-items:flex-start;justify-content:space-between;gap:20px}
.quiz-header h1{font-size:clamp(24px,3.4vw,35px);line-height:1.2;letter-spacing:-.04em;margin:5px 0 8px}
.quiz-header p{margin:0;color:var(--muted);font-size:13px}
.progress-panel{margin-top:25px;padding:19px 22px}.progress-labels{display:flex;justify-content:space-between;gap:10px;font-size:12px;font-weight:750;margin-bottom:10px}
.progress-track{height:9px;background:#e4ebf3;border-radius:99px;overflow:hidden}.progress-fill{height:100%;background:var(--teal);transition:width .2s ease}
.question-dots{display:flex;gap:6px;flex-wrap:wrap;margin-top:16px}.dot{width:32px;height:30px;padding:0;border:1px solid #d8e2ec;border-radius:8px;background:#f8fbfc;color:#456071;font-size:11px;font-weight:750}
.dot.current{background:var(--navy);border-color:var(--navy);color:#fff}.dot.done{background:#dff2f0;border-color:#82bbba;color:#164849}.dot.current.done{background:var(--navy);color:#fff}
.question-panel{margin-top:17px;padding:clamp(19px,2.7vw,28px);scroll-margin-top:14px}.qmeta{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:13px}
.qnumber{font-size:11px;color:var(--teal);font-weight:900;letter-spacing:.08em}.tag{border-radius:99px;padding:4px 10px;background:#eef3f8;color:#40566b;border:1px solid #dce5ed;font-size:11px;font-weight:800}
.question-panel h2{font-size:clamp(18px,2.3vw,25px);font-weight:780;line-height:1.48;letter-spacing:-.018em;white-space:pre-wrap;overflow-wrap:anywhere;margin:0 0 21px}
.answer-list{display:grid;gap:10px}.answer-choice{display:flex;align-items:flex-start;gap:12px;background:#fff;border-radius:12px;padding:13px 15px;border:1px solid #dce5ef;cursor:pointer;transition:border-color .15s,background .15s}
.answer-choice:hover{background:#f7fbfd;border-color:#a4c6d6}.answer-choice.selected{background:#ecf7fb;border-color:var(--teal);box-shadow:inset 0 0 0 1px var(--teal)}
.answer-choice.correct{background:var(--success-bg);border-color:#83c6a4}.answer-choice.wrong{background:var(--error-bg);border-color:#dea3a3}
.answer-choice input{margin:6px 1px 0;accent-color:var(--navy)}.option-letter{display:grid;place-items:center;flex:0 0 26px;width:26px;height:26px;border-radius:8px;background:#e8edf5;color:#405573;font-weight:850;font-size:12px}
.answer-text{line-height:1.6;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.feedback{margin-top:18px;padding:16px 17px;border-radius:12px;border:1px solid #a9d6c0;background:var(--success-bg);font-size:14px}
.feedback.wrong{background:var(--error-bg);border-color:#e7c2be}.feedback strong{display:block;margin-bottom:7px}.feedback p{margin:6px 0 0;color:#354c5b}
.actions{margin-top:22px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.actions .group{display:flex;gap:9px;flex-wrap:wrap}
.muted-note{font-size:12px;color:var(--muted);margin-top:15px}
.result-panel{margin-top:19px;padding:25px}.score{font-size:49px;letter-spacing:-.05em;line-height:1.15;font-weight:900;color:var(--navy);margin:8px 0}
.result-panel p{margin:7px 0;color:var(--muted)}.review-list{display:grid;gap:13px;margin-top:18px}.review-card{padding:18px 20px}.review-card header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.review-card h3{font-size:14px;margin:0 0 10px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}.review-card p{font-size:13px;color:var(--muted);margin:5px 0;overflow-wrap:anywhere}.review-card .solution{color:var(--success);font-weight:800}.review-card .wrong-text{color:var(--error);font-weight:800}
.tag.correct-tag{color:var(--success);background:var(--success-bg);border-color:#add5c4}.tag.wrong-tag{color:var(--error);background:var(--error-bg);border-color:#e3bdbc}
.empty{padding:22px;border:1px solid var(--border);background:var(--paper);border-radius:13px;color:var(--muted);font-size:13px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:1070px){.section-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.app-shell{grid-template-columns:232px minmax(0,1fr)}main{padding:27px 22px 70px}}
@media(max-width:700px){.app-shell{display:block}.sidebar{position:static;height:auto;padding:10px 14px}.brand{margin:0 0 9px;padding:7px 0 12px}.sidebar .nav-label,.sidebar .quiz-nav{display:none}.sidebar .quick-nav{display:flex;gap:7px}.sidebar .quick-nav .nav-button{width:auto;flex:1}.nav-button{padding:8px 10px}main{padding:20px 14px 60px}.quiz-grid,.section-grid{grid-template-columns:1fr}.topline{align-items:flex-start}.hero{border-radius:17px}.quiz-header{flex-direction:column;gap:13px}.quiz-card{padding:14px}.mock-card{flex-direction:column;align-items:flex-start}.actions{justify-content:stretch}.actions .group{width:100%}.actions .btn{flex:1}.review-card{padding:17px 14px}}
@media print{.sidebar,.topline,.actions,.question-dots,.btn{display:none!important}.app-shell{display:block}main{max-width:100%;padding:0}.question-panel,.result-panel,.review-card{box-shadow:none;break-inside:avoid}body{background:#fff}}
</style>
</head>
<body>
<div class="app-shell"><aside class="sidebar" id="sidebar" aria-label="Quiz navigation"></aside><main id="app" aria-live="polite"></main></div>
<script>
'use strict';
/* Both banks are embedded: this page works without network access or a build step. */
const QUIZZES = [{"id":1,"unit":1,"title":"Intro to Programming","questions":[{"id":"Q1-1","prompt":"Which line creates a read-only Kotlin variable holding the word Welcome?","options":["var message: Int = \"Welcome\"","val message = \"Welcome\"","String message = \"Welcome\"","message String = \"Welcome\""],"correct":[1],"explanation":"The val keyword declares a read-only reference, and Kotlin can infer that \"Welcome\" is a String. An Int cannot hold text, and the other declarations do not follow Kotlin syntax."},{"id":"Q1-2","prompt":"A Kotlin local variable will not need reassignment. Which declaration best expresses that intention?","options":["var name = \"Ada\"","val name = \"Ada\"","lateinit var name: String","const val name = \"Ada\""],"correct":[1],"explanation":"Prefer val whenever the reference does not need reassignment. var is for a variable whose value must change later; choosing val makes intent clearer and avoids accidental reassignment."},{"id":"Q1-3","prompt":"Suppose var count = 4. Which statements actually update count? Select all that apply.","options":["count++","count - 1","count--","count = count + 3"],"correct":[0,2,3],"explanation":"The ++ and -- operators change a mutable variable, as does assigning a new expression result. Merely calculating count - 1 does not store the result, so count remains unchanged."},{"id":"Q1-4","prompt":"Which pair of comment formats does Kotlin recognise and ignore when executing a program?","options":["# single line and <!-- block -->","-- single line and {- block -}","// single line and /* block */","// single line and <!-- block -->"],"correct":[2],"explanation":"Comments are written to help people understand the code. Kotlin recognises both single-line and multi-line comment syntax, and neither contributes executable instructions."},{"id":"Q1-5","prompt":"Which is NOT one of Kotlin’s standard built-in numeric or text type names?","options":["Boolean","Int","Decimal","String"],"correct":[2],"explanation":"Kotlin includes Boolean, Int and String. It does not define a standard type named Decimal; decimal-valued numbers are commonly represented with Float or Double."},{"id":"Q1-6","prompt":"Which statement correctly compares Float and Double in Kotlin?","options":["Float normally provides greater numeric precision than Double.","Float and Double both store only whole numbers.","Double normally provides greater precision than Float.","Double always uses fewer bits than Float."],"correct":[2],"explanation":"Both types represent floating-point values, but Double uses 64 bits while Float uses 32 bits. Double therefore generally retains more significant digits."},{"id":"Q1-7","prompt":"In a simple Kotlin console program, which function is the usual starting point?","options":["println()","main()","readLine()","return()"],"correct":[1],"explanation":"The Kotlin runtime starts a standalone program by invoking its main function. println prints a message but does not itself establish the application entry point."},{"id":"Q1-8","prompt":"Which statements about Kotlin function results are accurate? Select all that apply.","options":["A function without an explicit return type always returns String","A function result can be assigned to a variable","A Unit-returning function must write return Unit","A returned value must match the declared return type","A function with no useful result can have type Unit"],"correct":[1,3,4],"explanation":"A return value can be kept in a variable, and a function must return the declared type. Unit means there is no useful result to return; an explicit return Unit is not needed. Not every omitted type means String."},{"id":"Q1-9","prompt":"Which descriptions of Kotlin functions are accurate? Select all that apply.","options":["They can accept input parameters","Every parameter needs a default value","Values supplied during a call are arguments","Small functions can improve code reuse and maintenance"],"correct":[0,2,3],"explanation":"Parameters are declared in the function, and arguments are the values sent to it. Default values are optional. Dividing a program into focused functions helps with testing, reuse and readability."},{"id":"Q1-10","prompt":"What is an advantage of named arguments in a Kotlin function call?","options":["They convert arguments automatically into Strings.","They make all function parameters optional.","They allow arguments to be identified by name and supplied in a different order.","They bypass parameter type checking."],"correct":[2],"explanation":"A call such as draw(height = 3, width = 5) identifies the target parameter by name. This can be clearer than relying on argument position, provided the call follows Kotlin’s argument rules."}]},{"id":2,"unit":1,"title":"Set up Android Studio","questions":[{"id":"Q2-1","prompt":"In Android development, what does the abbreviation IDE mean?","options":["Integrated Development Environment","Internet Design Engine","Independent Device Emulator","Interface Debugging Extension"],"correct":[0],"explanation":"An Integrated Development Environment combines tools for writing, building, debugging and running software. Android Studio is an IDE tailored to Android apps."},{"id":"Q2-2","prompt":"Which of these are useful Android Studio features? Select all that apply.","options":["Code suggestions that help catch mistakes","A built-in device emulator","Live previews of Compose layouts","Automatic high-quality translation of all screen text"],"correct":[0,1,2],"explanation":"Android Studio supports code completion, an Android emulator and Compose previews. Translating an application into every language is a separate localisation task, not something Android Studio automatically guarantees."},{"id":"Q2-3","prompt":"What is the main benefit of using an Android Emulator when you lack a physical test phone?","options":["It converts Android apps into websites","It lets you run and test a virtual Android device","It removes all the need for testing","It uploads the app to Google Play"],"correct":[1],"explanation":"An emulator simulates an Android device on your computer, so you can install, operate and test an app without that particular physical device. Real-device tests still matter."},{"id":"Q2-4","prompt":"What do Android Studio project templates typically provide? Select all that apply.","options":["A starter project structure","Boilerplate code and configuration","A faster way to create a new app","A guarantee that the finished app will have no bugs"],"correct":[0,1,2],"explanation":"Templates create standard folders, build settings and starter code. They save setup time and reduce avoidable omissions, but they cannot guarantee that the app you subsequently write will be bug-free."},{"id":"Q2-5","prompt":"Which actions can start a new Android Studio project? Select all that apply.","options":["Use File > New > New Project in an open project","Choose New Project from the welcome screen","Rename an unrelated .txt file to .apk","Open the Logcat tab and press Run"],"correct":[0,1],"explanation":"Android Studio offers New Project in its welcome screen and through the File menu. Neither renaming a text file nor opening Logcat creates a valid Android project."},{"id":"Q2-6","prompt":"Which Activity method is used to supply a Jetpack Compose UI tree?","options":["onStop { }","Surface { }","setContent { }","onConfigurationChanged { }"],"correct":[2],"explanation":"Within an Activity, setContent { ... } sets the composable content shown by the screen. Surface is itself a composable and can be used inside that content."},{"id":"Q2-7","prompt":"Which annotation identifies a Kotlin function that provides Jetpack Compose UI?","options":["@Preview","@Composable","@UiThread","@Override"],"correct":[1],"explanation":"The @Composable annotation tells the Compose compiler that the function participates in UI composition. A normal Kotlin function does not become a composable just because it is called by an Activity."},{"id":"Q2-8","prompt":"Which Compose element is commonly used as a themed container that paints a surface and can hold child content?","options":["Spacer","Text","Surface","Icon"],"correct":[2],"explanation":"Surface can provide a background, shape, tonal treatment and child content according to the Material theme. Text displays text and Icon displays a graphic; neither serves the same general surface role."},{"id":"Q2-9","prompt":"What kind of Compose API is Modifier.padding(12.dp)?","options":["A Modifier operation","A ViewModel constructor","A lifecycle method","A project template"],"correct":[0],"explanation":"Padding is applied through a Modifier to alter layout spacing around content. Modifiers are chained to adjust sizing, drawing, alignment and interactions."},{"id":"Q2-10","prompt":"Which statement about the structure of a Compose app is correct?","options":["Every composable must be wrapped in Surface","Compose previews always require an emulator","A theme can style composables without putting every one inside Surface","A Surface replaces the Activity"],"correct":[2],"explanation":"Themes provide styling via composition and Material components. Surface is useful but not mandatory around every UI element; previews can often render without running an emulator."}]},{"id":3,"unit":1,"title":"Build a basic layout","questions":[{"id":"Q3-1","prompt":"Which description best matches Jetpack Compose?","options":["A tool for creating database tables","A modern declarative toolkit for Android user interfaces","An APK-signing server","A desktop-only graphic editor"],"correct":[1],"explanation":"Jetpack Compose lets developers describe the Android UI as composable functions. Compose updates parts of the screen when relevant state changes."},{"id":"Q3-2","prompt":"How are screens normally constructed in Jetpack Compose?","options":["By combining composable functions for layouts and UI elements.","By defining each visible element in AndroidManifest.xml.","By creating only XML layout files and inflating them.","By requiring a separate Activity for every UI element."],"correct":[0],"explanation":"A Compose screen consists of calls to composable functions, including layouts and visual elements. Complex screens are formed by combining smaller composables."},{"id":"Q3-3","prompt":"What annotation should precede a function that draws Compose UI?","options":["@AndroidView","@PreviewOnly","@Composable","@LayoutFunction"],"correct":[2],"explanation":"@Composable is the compiler-recognised annotation for declarative Compose functions. @Preview is an additional annotation used for design-time previews, not the main composability marker."},{"id":"Q3-4","prompt":"Which are basic layout containers in Compose? Select all that apply.","options":["Column","Row","Text","Box"],"correct":[0,1,3],"explanation":"Column stacks children vertically, Row horizontally and Box can overlay or align children. Text is a UI element that displays text, not a general-purpose layout container."},{"id":"Q3-5","prompt":"Which Android Studio tool helps browse and import drawables and other resources?","options":["Database Inspector","Resource Manager","Logcat","Profiler"],"correct":[1],"explanation":"Resource Manager is the dedicated window for browsing and managing many project resources. Logcat handles logs, while the Profiler monitors performance."},{"id":"Q3-6","prompt":"What is the generated class used to refer to app resources such as R.drawable.logo?","options":["ResourceRef","AndroidResources","R","ResourceID"],"correct":[2],"explanation":"The generated R class exposes IDs for app resources, grouped into categories such as drawable and string. It lets Kotlin code refer to packaged resources safely."},{"id":"Q3-7","prompt":"Which Compose helper loads a bundled drawable as a Painter?","options":["stringResource()","painterResource()","rememberSaveable()","drawResource()"],"correct":[1],"explanation":"painterResource(R.drawable.example) retrieves a Painter for a supported drawable resource. stringResource fetches a string rather than a drawable."},{"id":"Q3-8","prompt":"Which Image parameter provides useful spoken information for screen readers?","options":["contentDescription","fontSize","elevation","shape"],"correct":[0],"explanation":"contentDescription supplies accessible wording for a meaningful image. For an image that is purely decorative, contentDescription = null can prevent an unnecessary announcement."},{"id":"Q3-9","prompt":"Which Compose layout can draw multiple children in the same area so they overlap?","options":["Row","Column","Box","LazyRow"],"correct":[2],"explanation":"A Box provides a shared layout area in which children may overlap, with alignment and arrangement controlled by Modifiers. This differs from the linear arrangement of Row or Column."},{"id":"Q3-10","prompt":"For horizontal alignment towards the leading edge of the parent, which value is appropriate?","options":["Alignment.End","Alignment.CenterHorizontally","Alignment.Start","Alignment.Bottom"],"correct":[2],"explanation":"Alignment.Start refers to the start edge, respecting left-to-right or right-to-left layout direction. End means the opposite edge; Bottom is vertical."}]},{"id":4,"unit":2,"title":"Kotlin fundamentals","questions":[{"id":"Q4-1","prompt":"Given val number = 25, what is the value of number % 10 in Kotlin?","options":["0","5","2","10"],"correct":[1],"explanation":"25 % 10 evaluates to 5, not 0. The % operator gives the remainder after division; the branch only runs for multiples of ten."},{"id":"Q4-2","prompt":"Assume val x: Int = 5. Which expressions evaluate to true? Select all that apply.","options":["x == 5","x in 1..5","x is Int","x > 8"],"correct":[0,1,2],"explanation":"x equals 5, lies inside the inclusive 1..5 range and has Int type. Since 5 is not greater than 8, the last expression is false."},{"id":"Q4-3","prompt":"Which term is not one of the core object-oriented principles?","options":["Inheritance","Abstraction","Readability","Polymorphism"],"correct":[2],"explanation":"Object-oriented concepts commonly include encapsulation, abstraction, inheritance and polymorphism. Readability is important for good code but is not one of those principles."},{"id":"Q4-4","prompt":"Which list contains all four Kotlin visibility modifiers?","options":["public, private, protected, internal","public, private, static, internal","public, protected, abstract, internal","private, open, internal, protected"],"correct":[0],"explanation":"Kotlin has public, private, protected and internal visibility. Words such as open or abstract influence inheritance, not visibility; static is not a Kotlin visibility modifier."},{"id":"Q4-5","prompt":"Inside an overriding member, which keyword accesses a superclass implementation?","options":["this","super","parent","base"],"correct":[1],"explanation":"super calls members inherited from a superclass, such as super.onCreate(...). this refers to the current instance rather than the parent implementation."},{"id":"Q4-6","prompt":"What Kotlin declaration specifies functions or properties that an implementing class must provide?","options":["interface","object instance","lambda","import"],"correct":[0],"explanation":"An interface defines a contract that implementing types follow. Interfaces can also supply default implementations, but they identify shared capabilities."},{"id":"Q4-7","prompt":"Which application value is a good candidate for a nullable type?","options":["A required account ID","A username that always exists","An optional avatar URL","A count with value zero"],"correct":[2],"explanation":"An optional avatar might not exist at all, so String? can represent either a URL or null. A numeric count of zero is a genuine value, not the same as missing data."},{"id":"Q4-8","prompt":"In Kotlin, which operator invokes a member only when the receiver is non-null?","options":["!!","?:","?.","::"],"correct":[2],"explanation":"The safe-call operator ?. accesses a property or calls a function only if the receiver is not null; otherwise the expression evaluates to null. !! instead asserts non-null and can throw."},{"id":"Q4-9","prompt":"Which statement about Kotlin functions is NOT generally correct?","options":["A function may be supplied as an argument","A function may be returned by another function","Function types can look like (Int) -> Unit","Any function can be converted into an arbitrary unrelated data type"],"correct":[3],"explanation":"Kotlin supports higher-order functions and function-type values. A function is not automatically interchangeable with any unrelated data type, even though functions can be passed around like values."},{"id":"Q4-10","prompt":"What is the name for an anonymous function expression such as { value: Int -> value * 2 }?","options":["Lambda expression","Visibility modifier","Data class","Companion constructor"],"correct":[0],"explanation":"A lambda is a compact, unnamed function expression that can be assigned to a variable or passed to a higher-order function. Its expression body calculates the result."},{"id":"Q4-if-expression","prompt":"What value is stored in result after this Kotlin code runs?\n\nval temperature = 18\nval result = if (temperature >= 20) \"Warm\" else \"Cool\"","options":["true","\"Cool\"","18","\"Warm\""],"correct":[1],"explanation":"Kotlin if can return a value. Because 18 is less than 20, the else branch is evaluated and the String \"Cool\" becomes the value of result."},{"id":"Q4-lambda-syntax","prompt":"Which line is a valid Kotlin lambda that accepts a String and returns its length?","options":["(text: String) -> text.length","{ text: String -> text.length }","{ text.length : String -> }","lambda(text: String) = text.length"],"correct":[1],"explanation":"A Kotlin lambda uses braces. Parameters and types come before ->, and the expression evaluated comes after it. In this case text.length produces an Int."}]},{"id":5,"unit":2,"title":"Add a button to an app","questions":[{"id":"Q5-1","prompt":"Which composable is used to show a bitmap or vector picture in a Compose screen?","options":["Image","Button","Spacer","Slider"],"correct":[0],"explanation":"The Image composable draws a picture using a Painter or ImageBitmap. A Button makes something clickable, while Spacer reserves empty space."},{"id":"Q5-2","prompt":"What does contentAlignment = Alignment.Center do for children of a Compose Box?","options":["Aligns children at the top centre.","Centres children horizontally and vertically.","Aligns children only on the horizontal axis.","Places children in a vertical scrolling list."],"correct":[1],"explanation":"For example, Box(contentAlignment = Alignment.Center) centres children horizontally and vertically. Other layout components may use separate horizontal and vertical alignment parameters."},{"id":"Q5-3","prompt":"Which Compose function retains a calculated object across ordinary recompositions?","options":["Column","remember","@Preview","Modifier"],"correct":[1],"explanation":"remember caches a value within the composition while the relevant part remains composed. It does not by itself guarantee preservation after an Activity recreation."},{"id":"Q5-4","prompt":"When an Android Studio debugger pauses at a breakpoint, what can you inspect?","options":["Current variable values and the call stack.","Only the generated APK file size.","Only whether the Android Emulator is installed.","Only resources stored in the drawable directory."],"correct":[0],"explanation":"Debuggers let you inspect the stack, variable values and execution flow when an app is suspended. This helps identify why code behaves unexpectedly."},{"id":"Q5-5","prompt":"Which helper creates Compose-observable mutable state for a counter?","options":["mutableStateOf(0)","listOf(0)","println(0)","Modifier.size(0.dp)"],"correct":[0],"explanation":"mutableStateOf produces State backed by an observable value. Reading that state in a composable allows Compose to schedule recomposition when the value changes."},{"id":"Q5-6","prompt":"Which layout shows children from top to bottom in order?","options":["Box","Row","Column","Surface"],"correct":[2],"explanation":"Column arranges children vertically. Row arranges horizontally and Box overlays/aligns children within the same area."},{"id":"Q5-7","prompt":"Which debugger action finishes the current function and returns to its caller?","options":["Step into","Step out","Resume","Step over"],"correct":[1],"explanation":"Step out continues execution to the end of the current function and pauses in its caller. Step into enters a called function, and step over executes a call without entering it."}]},{"id":6,"unit":2,"title":"Interacting with UI and state","questions":[{"id":"Q6-1","prompt":"What is the name of the first pass when Compose evaluates composable functions to establish the UI?","options":["Initial composition","Recomposition","Process death","Configuration change"],"correct":[0],"explanation":"Initial composition is the first creation of the composition tree. Subsequent state-driven updates may trigger recomposition of affected functions."},{"id":"Q6-2","prompt":"What is the Compose process that updates affected composables after observable UI state changes?","options":["Resource inflation","Recomposition","Compilation","Serialization"],"correct":[1],"explanation":"The declarative UI describes what should be displayed. Recomposition re-runs the parts that need to reflect changed state; directly modifying a traditional View tree is not the Compose approach."},{"id":"Q6-3","prompt":"What does Compose call rerunning affected UI functions after observed state changes?","options":["Recomposition","Installation","Compilation","Serialization"],"correct":[0],"explanation":"Recomposition updates the UI description when state read by the composables changes. Compose can skip unaffected code, so it does not necessarily redraw the whole screen."},{"id":"Q6-4","prompt":"What is the common term for data that can change over the life of the app, such as a form value?","options":["State","Theme","Resource ID","Package"],"correct":[0],"explanation":"State is the current information that helps determine the UI, such as selected options or text input. State changes can be observed to refresh the screen."},{"id":"Q6-5","prompt":"Which pattern moves state ownership from a child composable to its parent?","options":["State hoisting","Screen mirroring","Method overloading","Type inference"],"correct":[0],"explanation":"State hoisting makes a child composable more reusable: the parent supplies the current value and a callback, following the principle that state flows down and events flow up."},{"id":"Q6-6","prompt":"Which KeyboardActions callback is commonly associated with the Next IME action?","options":["onSend","onDone","onNext","onGo"],"correct":[2],"explanation":"KeyboardActions(onNext = { ... }) handles the keyboard’s Next action, often used to move focus to another field. Other callbacks correspond to different IME actions."},{"id":"Q6-7","prompt":"Which Kotlin maths function produces the smallest whole-number-valued Double not below its input?","options":["floor()","ceil()","abs()","roundToInt()"],"correct":[1],"explanation":"kotlin.math.ceil(2.3) is 3.0: it rounds upwards to the least integer-valued Double greater than or equal to the input. floor rounds down."},{"id":"Q6-8","prompt":"Which Android Studio tool inspects the hierarchy of a running Compose interface?","options":["Device Manager","Resource Manager","Layout Inspector","Gradle Sync"],"correct":[2],"explanation":"Layout Inspector shows details of the UI while the app runs on an emulator or device, helping investigate layout and recomposition behaviour."},{"id":"Q6-9","prompt":"Where do Android instrumented UI tests normally live in an Android module?","options":["src/main","src/test","src/androidTest","src/res"],"correct":[2],"explanation":"Instrumented tests belong under src/androidTest and run with the Android testing environment. Local JVM tests normally use src/test."},{"id":"Q6-10","prompt":"Which annotation normally marks a JUnit test method?","options":["@Test","@Preview","@Composable","@Inject"],"correct":[0],"explanation":"@Test identifies a method as a JUnit test. @Preview is for rendering Composables in the IDE, and @Composable marks UI functions."}]},{"id":7,"unit":3,"title":"More Kotlin fundamentals","questions":[{"id":"Q7-1","prompt":"Which line correctly declares a Kotlin data class with a name property?","options":["class data User(val name: String)","data class User(val name: String)","class User: data(val name: String)","data User = class(name: String)"],"correct":[1],"explanation":"The data modifier precedes class, followed by the class name and primary constructor. A data class automatically gains useful value-oriented functions such as equals and copy."},{"id":"Q7-2","prompt":"Where may direct subclasses of a Kotlin sealed class be declared?","options":["In any module if they import the sealed class.","Only in the same function as the sealed class.","In the same package and module as the sealed class.","Only in the AndroidManifest.xml file."],"correct":[2],"explanation":"Kotlin restricts where direct sealed subclasses can be declared, allowing the compiler to know the closed set of direct possibilities. Later descendants of a non-sealed subclass can have different rules."},{"id":"Q7-3","prompt":"Which symbols surround a generic type argument in Kotlin, as in List of String?","options":["(String)","[String]","<String>","{String}"],"correct":[2],"explanation":"Generic type parameters and type arguments use angle brackets. For example, List<String> means a list whose element type is String."},{"id":"Q7-4","prompt":"What kind of Kotlin class is a good fit for a fixed set of named directions?","options":["enum class","data class","abstract class","open class"],"correct":[0],"explanation":"An enum class represents a fixed collection of named constants, such as NORTH and SOUTH. It suits a finite set of choices."},{"id":"Q7-5","prompt":"Which factory makes a list to which you can append new items?","options":["listOf()","arrayListFixed()","mutableListOf()","setOf()"],"correct":[2],"explanation":"mutableListOf() creates a MutableList, supporting operations such as add and remove. listOf() exposes a read-only List interface."},{"id":"Q7-6","prompt":"Which standard collection operations commonly accept lambda functions? Select all that apply.","options":["map","filter","forEach","sortListsMagically"],"correct":[0,1,2],"explanation":"map transforms each element, filter keeps elements matching a predicate and forEach performs an action for each element. Each receives a function/lambda, making these higher-order operations."},{"id":"Q7-7","prompt":"Given val names = listOf(\"Ana\", \"Bo\", \"Cy\"), which expressions read \"Cy\"? Select all that apply.","options":["names[2]","names.get(2)","names[3]","names.contains(2)"],"correct":[0,1],"explanation":"Kotlin list indexes start at zero, so the third item has index 2. names[3] is outside the list and contains(2) checks whether the list holds the integer 2."},{"id":"Q7-8","prompt":"What name describes the pattern where one shared object instance is used throughout an application?","options":["Singleton","Iterator","Extension function","Generic"],"correct":[0],"explanation":"A singleton has one instance. Kotlin can use an object declaration to create one directly, useful for stateless utilities or shared coordinators."},{"id":"Q7-9","prompt":"Which claim about Kotlin sets and maps is accurate?","options":["A Set can contain repeated equal items","Every Map key must be unique","Map keys may be repeated indefinitely","A Set is indexed like an Array"],"correct":[1],"explanation":"Sets contain distinct elements and map keys must be unique. A map may still hold repeated values under different keys."},{"id":"Q7-10","prompt":"For a Kotlin collection val items = listOf(1, 2, 3), which property gives its item count?","options":["items.length","items.size","items.countValue","len(items)"],"correct":[1],"explanation":"The size property gives the number of elements in a collection, which is 3 here. count() is also available in many collection APIs, but length is used for strings and arrays differ by type."}]},{"id":8,"unit":3,"title":"Build a scrollable list","questions":[{"id":"Q8-1","prompt":"What is the purpose of the foreground and background layers in an adaptive Android launcher icon?","options":["To make the icon interactive like a button.","To allow launchers to mask the icon into supported shapes and apply effects.","To store two versions of the app binary.","To replace the Android resource system."],"correct":[1],"explanation":"Adaptive icons have foreground and background layers so launchers can apply masks and motion. The layers need not both be vector drawables; image formats and colours vary by setup."},{"id":"Q8-2","prompt":"Which Compose container is designed for a long vertically scrolling list whose items are composed as needed?","options":["Row","LazyColumn","Box","Spacer"],"correct":[1],"explanation":"LazyColumn lazily creates visible list content and is a good default for large or dynamic vertical lists. A plain Column does not provide the same lazy-item behaviour."},{"id":"Q8-3","prompt":"A vector drawable in an Android res/drawable folder is usually defined in which file type?","options":[".jpg",".xml",".txt",".mp4"],"correct":[1],"explanation":"Android vector drawables are expressed as XML resources containing vector path information. They can scale without bitmap pixelation."},{"id":"Q8-4","prompt":"Which composable is intended for a large vertically scrolling grid?","options":["LazyHorizontalGrid","LazyColumn","LazyVerticalGrid","Row"],"correct":[2],"explanation":"LazyVerticalGrid lays out items in multiple columns while scrolling vertically. LazyColumn is one-dimensional, not a true grid."},{"id":"Q8-5","prompt":"Why is a plain Column usually less suitable than LazyColumn for an unknown, very large list?","options":["Column cannot contain Text","Column eagerly composes its children rather than lazily loading visible items","Column only works in landscape mode","Column forces the keyboard open"],"correct":[1],"explanation":"A Column composes all its supplied children, so it may do excessive work for a long list. LazyColumn composes and lays out only needed items."},{"id":"Q8-6","prompt":"Inside LazyColumn { ... }, which builder displays each entry from a collection?","options":["items(myList)","remember(myList)","setContent(myList)","painterResource(myList)"],"correct":[0],"explanation":"The items builder generates lazy list entries from a collection. The lazy container decides which entries need to be composed on screen."},{"id":"Q8-7","prompt":"For a simple toolbar with icons side by side, which Compose layout would you choose?","options":["Column","Row","Box","LazyVerticalGrid"],"correct":[1],"explanation":"Row places child elements horizontally from start to end. Column would stack them vertically."},{"id":"Q8-8","prompt":"To stack a label above a button, which layout most directly matches the arrangement?","options":["Row","Icon","Column","Card"],"correct":[2],"explanation":"Column places children in a vertical sequence, making it suitable for a label on one line and a button below it. A Card is a container style, not inherently a vertical arrangement."}]},{"id":9,"unit":3,"title":"Build beautiful apps","questions":[{"id":"Q9-1","prompt":"What can purposeful UI animations contribute to a mobile app?","options":["Explain changes in state","Give visual feedback","Make screen transitions feel more polished","All three of these"],"correct":[3],"explanation":"Animations can communicate feedback, reveal what changed and improve perceived polish. They should support understanding rather than distract or slow down the user."},{"id":"Q9-2","prompt":"Which two properties chiefly control the behaviour of a spring animation in Compose?","options":["Distance and colour","Damping ratio and stiffness","Latitude and longitude","Font size and typeface"],"correct":[1],"explanation":"Spring motion is physics-based. Stiffness controls how strongly the spring pulls towards its target, while damping affects oscillation and settling."},{"id":"Q9-3","prompt":"Which physical properties are used to describe motion in a Compose spring animation?","options":["Font weight and line height","Padding and elevation","Stiffness and damping","Hue and transparency"],"correct":[2],"explanation":"Spring animation responds to a target using stiffness and damping rather than simply travelling along a fixed-duration linear timeline."},{"id":"Q9-4","prompt":"In a Material colour scheme, which role commonly represents the main brand or prominent accent colour?","options":["error","outline","primary","inverseSurface"],"correct":[2],"explanation":"primary is the main accent/brand colour role within a Material scheme. Surface and background roles cover areas behind components, so primary does not necessarily occupy the most screen pixels."},{"id":"Q9-5","prompt":"Which Kotlin source file is conventionally used to define Compose theme shape choices in many tutorials?","options":["Shape.kt","MainActivity.kt","Strings.kt","AndroidManifest.kt"],"correct":[0],"explanation":"A theme package often includes Shape.kt to define rounded corners and shape values. These filenames are conventions from sample projects, not a mandatory requirement of the framework."},{"id":"Q9-6","prompt":"How can @Preview be used when developing Jetpack Compose screens?","options":["Only once for an entire Android project.","On several composables to preview different screens and configurations.","Only on functions inside AndroidManifest.xml.","Only when an Android phone is physically connected."],"correct":[1],"explanation":"Multiple previews are supported, allowing developers to check different components, device sizes, fonts, themes and states without running the full app."},{"id":"Q9-7","prompt":"Which colour notation encodes red, green and blue as six hexadecimal digits?","options":["#RRGGBB","RGB(0..100)","0bRGB","#CMYK"],"correct":[0],"explanation":"The six-digit hexadecimal form #RRGGBB uses two digits each for red, green and blue. An eight-digit hexadecimal notation may additionally encode alpha, depending on the API."},{"id":"Q9-8","prompt":"Which file in many Compose starter projects connects typography, colours and shapes into a Material theme?","options":["Color.kt","Theme.kt","Shape.kt","Icons.kt"],"correct":[1],"explanation":"Theme.kt typically defines the top-level theme composable and applies the configured colour scheme, typography and shapes. Exact project organisation can vary."},{"id":"Q9-9","prompt":"What property makes a Material card appear raised by introducing shadow or tonal depth?","options":["Elevation","Content description","Text alignment","Window size class"],"correct":[0],"explanation":"Elevation describes how raised a component appears, often expressed through shadow and/or tonal treatment. Increasing it can visually separate a card from the background."},{"id":"Q9-10","prompt":"Which are reasonable benefits of a dark theme? Select all that apply.","options":["It may reduce OLED display power use","It can help in dim surroundings","Some users prefer reduced screen brightness and glare","It guarantees better contrast for everyone"],"correct":[0,1,2],"explanation":"Dark themes can save power on suitable displays and feel more comfortable in low light for some users. They are not automatically more accessible for every user; contrast and individual needs still matter."},{"id":"Q9-11","prompt":"Which Android accessibility service announces UI elements aloud and supports screen-reader navigation?","options":["Switch Access","Voice Access","TalkBack","Live Caption"],"correct":[2],"explanation":"TalkBack is a screen reader that announces UI elements and supports spoken navigation. Switch Access is the Android accessibility feature for controlling the interface with switches."},{"id":"Q9-12","prompt":"Which property helps a screen reader explain a meaningful image in a Compose screen?","options":["rotationZ","contentDescription","shadowElevation","alpha"],"correct":[1],"explanation":"A useful contentDescription provides words for an image or icon when the visual meaning is not otherwise communicated. Decorative images can use null to avoid redundant announcements."}]},{"id":10,"unit":4,"title":"Architecture Components","questions":[{"id":"Q10-1","prompt":"When an Activity starts losing interaction focus, which lifecycle callback normally happens first?","options":["onStart()","onCreate()","onPause()","onDestroy()"],"correct":[2],"explanation":"onPause() is called as the Activity leaves the resumed foreground state. The Activity might still be partly visible; onStop() follows when it becomes fully invisible."},{"id":"Q10-2","prompt":"Which Activity lifecycle callback indicates the Activity is no longer visible?","options":["onResume()","onStop()","onStart()","onRestart()"],"correct":[1],"explanation":"onStop() is reached when the Activity is no longer visible. onPause() can occur before this while some part of the Activity remains visible."},{"id":"Q10-3","prompt":"Which Android logging call writes a message at Debug level?","options":["Log.e(tag, text)","Log.d(tag, text)","Log.w(tag, text)","Log.i(tag, text)"],"correct":[1],"explanation":"Log.d writes a Debug-priority message using a tag and message. Log.e is for errors, Log.w for warnings and Log.i for informational events."},{"id":"Q10-4","prompt":"Which Compose state helper is appropriate for small saveable values that should survive Activity recreation on rotation?","options":["rememberSaveable { ... }","remember { ... }","mutableListOf()","println()"],"correct":[0],"explanation":"rememberSaveable can save supported values using the saved-instance-state mechanism, allowing them to survive configuration changes and eligible process recreation. remember alone does not survive Activity recreation."},{"id":"Q10-5","prompt":"Which software design principle gives UI code, state management and data access focused responsibilities?","options":["Separation of concerns","Tight coupling","Screen recomposition","Navigation back stacking"],"correct":[0],"explanation":"The UI, state-handling and data access code should have focused responsibilities. This makes the app easier to maintain and test, and changes in one area are less likely to affect another."},{"id":"Q10-6","prompt":"Which statement best describes UI state in an Android app?","options":["It is the physical arrangement of pixels, rather than data.","It stores information the UI should show, such as items or loading status.","It always consists only of XML resources.","It is the same thing as the Activity lifecycle."],"correct":[1],"explanation":"UI state holds information such as a loading indicator or a list of items. Composable UI reads that state and displays the appropriate output."},{"id":"Q10-7","prompt":"What two layers form the recommended minimum architecture for many Android apps?","options":["UI and data","Animation and logging","Domain and navigation","Theme and resource"],"correct":[0],"explanation":"Android architecture guidance separates a UI layer, which renders and manages user interaction, from a data layer, which provides and manages application data. A domain layer is optional for complex business logic."},{"id":"Q10-8","prompt":"What is a defining characteristic of Kotlin StateFlow?","options":["It has no current value until collection starts.","It emits a value exactly once and then closes.","It holds a current value and supplies updates to collectors.","It can be observed only by XML-based layouts."],"correct":[2],"explanation":"StateFlow is a hot observable flow that holds a current value. Collectors receive the latest state and subsequent updates, making it suitable for ViewModel UI state."},{"id":"Q10-9","prompt":"Which Gradle dependency configuration commonly adds libraries for local JVM unit tests?","options":["implementation","runtimeOnly","testImplementation","androidTestImplementation"],"correct":[2],"explanation":"testImplementation provides dependencies to the local test source set, usually src/test. androidTestImplementation is for instrumented Android tests."},{"id":"Q10-10","prompt":"Where do standard local JVM unit tests run in an Android project?","options":["Only on a physical phone.","Only inside an Android Emulator.","On the development computer using the JVM.","Only after uploading the app to Google Play."],"correct":[2],"explanation":"Local JVM unit tests generally execute on your development computer. Instrumented tests, such as many UI tests, run in an Android environment on a device or emulator."}]},{"id":11,"unit":4,"title":"Navigation in Jetpack Compose","questions":[{"id":"Q11-1","prompt":"In a basic string-route Navigation Compose example, which type stores a destination route such as \"details\"?","options":["String","Modifier","IntArray","NavHost"],"correct":[0],"explanation":"Simple route-based navigation can use string route identifiers such as \"home\" or \"details\". Newer type-safe Navigation APIs also support serializable route types."},{"id":"Q11-2","prompt":"Which NavHost argument identifies the first destination displayed by the navigation graph?","options":["initialScreen","startDestination","startingActivity","defaultComposable"],"correct":[1],"explanation":"The startDestination parameter selects the initial destination within the navigation graph. It gives the controller a defined place to begin."},{"id":"Q11-3","prompt":"What helps keep Compose screen functions reusable and easy to test when they trigger navigation?","options":["Passing NavHostController into every small child composable.","Performing navigation directly from data classes.","Providing event callbacks such as onOpenDetails to screens.","Storing all routes in a Text composable."],"correct":[2],"explanation":"Keeping navigation decisions at the navigation layer makes screen composables easier to reuse and test. A screen can signal actions like onOpenDetails without needing direct controller access."},{"id":"Q11-4","prompt":"What composable connects a NavController to the screen content defined for each route?","options":["NavHost","NavController","ScaffoldState","BackHandler"],"correct":[0],"explanation":"NavHost displays the destination composable associated with the active route. NavController is the object used to request navigation and manage the stack."},{"id":"Q11-5","prompt":"In a Navigation Compose graph, what does composable(route = \"home\") { ... } declare?","options":["An app permission","A navigation destination and its UI","A theme colour","A device sensor"],"correct":[1],"explanation":"The composable builder connects a route identifier with the UI to display for that destination. The NavHost can then show it when that route becomes active."},{"id":"Q11-6","prompt":"Which NavController method requests navigation to a different destination?","options":["navigate(...)","popBackStack()","restoreState()","setContent()"],"correct":[0],"explanation":"navigate requests a new destination, normally placing an entry onto the back stack. popBackStack moves backward instead."},{"id":"Q11-7","prompt":"Which NavController function normally removes the current back-stack destination to go back?","options":["launchSingleTop()","popBackStack()","findStartDestination()","navigateForward()"],"correct":[1],"explanation":"popBackStack removes one or more destination entries and can reveal the previous screen. By contrast, navigate adds or selects a target destination."},{"id":"Q11-8","prompt":"What normally happens when NavController navigates to a new destination without options that clear history?","options":["The new destination is pushed on top of the back stack.","All previous destinations are permanently erased.","The app must create a new Android process.","The navigation stack becomes empty."],"correct":[0],"explanation":"The back stack tracks navigation history, with the active destination at the top. System Back commonly removes that top destination and returns to the previous one."},{"id":"Q11-9","prompt":"Which Intent feature holds additional key-value information carried with the Intent?","options":["extras","manifest entries","themes","permissions"],"correct":[0],"explanation":"Intent extras are additional values attached to an Intent, often accessed with putExtra and suitable get methods. They are separate from navigation graph route arguments."},{"id":"Q11-10","prompt":"Which observable type provides a current UI state value that a ViewModel may publish?","options":["MutableList only","StateFlow","Modifier","Canvas"],"correct":[1],"explanation":"StateFlow always has a current value and emits updates for collectors. A ViewModel often exposes a read-only StateFlow while updating an internal MutableStateFlow."},{"id":"Q11-11","prompt":"Which claims about Android Back and app-bar Up are true? Select all that apply.","options":["System Back is part of Android navigation","An app can show an Up arrow in its own top app bar","Up always works automatically without an onClick handler","Up visibility can depend on which screen is shown"],"correct":[0,1,3],"explanation":"Back is system navigation. An Up arrow belongs to the app interface and is commonly shown on child destinations; apps generally connect its click action to navigation logic rather than assuming it works automatically."}]},{"id":12,"unit":4,"title":"Adaptive layouts","questions":[{"id":"Q12-1","prompt":"Which Compose API handles system Back presses from within composable code?","options":["BackHandler","BackButtonLayout","PopView","BackNavigatorWidget"],"correct":[0],"explanation":"BackHandler registers a composable Back callback that can be enabled or disabled. It works with or without a Navigation Compose NavHost."},{"id":"Q12-2","prompt":"Which design choices can improve a large-screen app? Select all that apply.","options":["Position important controls where they are easy to reach","Show related list and details simultaneously when space allows","Assume a stretched phone layout is always sufficient","Use the available width rather than leaving everything arbitrarily centred"],"correct":[0,1,3],"explanation":"Larger displays benefit from considered control placement, sensible use of available space and supporting-pane layouts. Simply stretching a phone interface often wastes space and complicates interactions."},{"id":"Q12-3","prompt":"What term describes the size threshold where an adaptive interface switches layout?","options":["Breakpoint","Resource ID","Activity state","Content slot"],"correct":[0],"explanation":"A breakpoint is a width or height boundary at which you choose another layout. It helps the UI react to available window dimensions rather than assuming a fixed device type."},{"id":"Q12-4","prompt":"Which situation is a typical example of an Android app having a compact window width?","options":["A wide external desktop monitor","A full-screen landscape tablet","A phone held in portrait orientation","An expanded large-screen split-pane layout"],"correct":[2],"explanation":"Compact width is intended for narrower available windows, with portrait phones a typical example. The window width matters, not merely the device label."},{"id":"Q12-5","prompt":"What Android adaptive UI concept groups current window widths into categories such as compact, medium and expanded?","options":["WindowSizeClass","ViewModelStore","WindowFragment","NavBackStackEntry"],"correct":[0],"explanation":"WindowSizeClass gives a high-level categorisation of the available app window dimensions. It helps choose different layouts as the app is resized or rotated."},{"id":"Q12-6","prompt":"Which navigation pattern is frequently suitable for medium-width adaptive layouts?","options":["Navigation rail","Bottom sheet only","Fixed full-screen dialog","Hidden navigation with no affordance"],"correct":[0],"explanation":"A navigation rail can provide clear destination access in medium-width layouts. Compact layouts often use bottom navigation, while expanded screens may support a larger navigation drawer or rail."},{"id":"Q12-7","prompt":"How should an adaptive Compose layout be checked for different screen conditions?","options":["Use one preview and assume it represents every size and theme.","Preview and test multiple relevant widths, themes and configurations.","Test only on a single large tablet resolution.","Avoid previews because they cannot contain composables."],"correct":[1],"explanation":"Adaptive UIs should be previewed and tested across relevant sizes and configurations. Multiple @Preview declarations make it easier to inspect compact and expanded examples."},{"id":"Q12-8","prompt":"In a two-pane list-detail layout on a wide screen, what can the user normally do?","options":["See only a list and always navigate away to see details.","See list and selected detail together, making Back less necessary to return to the list.","See the detail pane only when the phone is in portrait mode.","Use the two-pane arrangement only for compact windows."],"correct":[1],"explanation":"A two-pane list-detail interface displays both contexts simultaneously. On a compact single-pane layout, navigation between list and detail generally needs an appropriate Back action."},{"id":"Q12-9","prompt":"A contacts app has a list and a selected contact’s details. What is a sensible responsive layout?","options":["Always stretch a single contact row to the full tablet width","Show a list alone on narrow windows and a list beside details on wide windows","Reset the selected contact after every rotation","Require the user to exit the app to view the list"],"correct":[1],"explanation":"List-detail layouts can use one pane on narrow screens and two panes side by side when space allows. Selection should be preserved when practical, including across configuration changes."},{"id":"Q12-10","prompt":"For filtered instrumented test execution using Android test-runner custom annotations, which configuration is involved?","options":["Instrumentation arguments","Theme overlay","Resource qualifiers","Kotlin compiler warnings"],"correct":[0],"explanation":"Instrumentation arguments passed to the test runner can configure filters, including annotation-based selection. This applies to instrumented Android tests, not ordinary local JVM test discovery."}]}];
const MOCK_QUESTIONS = [{"id":"M01","unit":1,"prompt":"A student wants a Kotlin variable that cannot be reassigned after it is created. Which declaration meets that requirement?","options":["var lesson = \"State\"","val lesson = \"State\"","String lesson = \"State\"","const lesson: String = \"State\""],"correct":[1],"explanation":"val declares a read-only reference. var is reassignable; Java-style declarations and this const syntax are not valid here."},{"id":"M02","unit":1,"prompt":"You create a plain Kotlin console application. Which function is called when it starts running?","options":["runApp()","onStart()","main()","startApp()"],"correct":[2],"explanation":"A standard Kotlin application begins execution in its main function."},{"id":"M03","unit":1,"prompt":"Consider: fun showMessage() { println(\"Hello\") }. What return type does Kotlin infer for showMessage?","options":["String","Any","Nothing","Unit"],"correct":[3],"explanation":"A function with no meaningful returned value has return type Unit, which may be inferred."},{"id":"M04","unit":1,"prompt":"Given fun badge(name: String, level: Int), which call demonstrates named arguments in a changed order?","options":["badge(level = 3, name = \"Ada\")","badge(3, \"Ada\")","badge(level: 3, name: \"Ada\")","badge(name -> \"Ada\", level -> 3)"],"correct":[0],"explanation":"Named arguments specify each parameter with name = value; they permit a different argument order."},{"id":"M05","unit":1,"prompt":"Which description best fits Android Studio as a development tool?","options":["A phone-only operating system","An integrated environment for writing, building, and debugging apps","A cloud-only app store","A virtual Android device image"],"correct":[1],"explanation":"Android Studio is an IDE: an integrated development environment for editing, building, debugging, and testing applications."},{"id":"M06","unit":1,"prompt":"A developer has no physical Android phone available. What tool can run the app in a virtual Android device?","options":["Theme Editor","App Inspection","Android Emulator","Layout Preview only"],"correct":[2],"explanation":"The Android Emulator runs an Android Virtual Device on a computer to test apps without physical hardware."},{"id":"M07","unit":1,"prompt":"Inside MainActivity.onCreate(), which call establishes a Jetpack Compose UI tree?","options":["drawCompose { }","setContent { }","launchScreen { }","inflateContent { }"],"correct":[1],"explanation":"setContent accepts composable content and makes it the Activity UI."},{"id":"M08","unit":1,"prompt":"A profile card needs a name label drawn on top of a photograph. Which composable naturally places children in the same area?","options":["Row","LazyColumn","Box","Column"],"correct":[2],"explanation":"Box can stack children on top of one another, unlike Row and Column, which primarily arrange children in a line."},{"id":"M09","unit":1,"prompt":"You have a PNG inside res/drawable. What would you normally pass into Image to obtain a Painter for that resource?","options":["painterResource(R.drawable.banner)","stringResource(R.drawable.banner)","Modifier.drawable(R.drawable.banner)","rememberImage(R.drawable.banner)"],"correct":[0],"explanation":"painterResource loads a drawable as a Painter that Image can display."},{"id":"M10","unit":1,"prompt":"In an Android app, what does the generated name R.string.app_name represent?","options":["A Kotlin data class","A resource identifier","A running Activity instance","A Gradle plugin"],"correct":[1],"explanation":"Android generates the R class, which contains IDs for compiled resources such as strings and drawables."},{"id":"M11","unit":2,"prompt":"What is stored in message after this Kotlin statement?\nval points = 9\nval message = if (points > 10) \"High\" else \"Low\"","options":["9","true","\"Low\"","\"High\""],"correct":[2],"explanation":"9 is not greater than 10; the else branch returns the String \"Low\", which is assigned to message."},{"id":"M12","unit":2,"prompt":"The variable user may be null. Which expression accesses user.name only when user is not null?","options":["user!!.name","user?.name","user::name","user?:name"],"correct":[1],"explanation":"The ?. safe-call operator accesses a member only on a non-null receiver; otherwise the overall expression is null."},{"id":"M13","unit":2,"prompt":"Several classes must all provide a method named save(). Which Kotlin construct specifies that shared contract?","options":["interface","enum constant","package","nullable variable"],"correct":[0],"explanation":"An interface defines members that implementing classes must provide (unless they have a default implementation)."},{"id":"M14","unit":2,"prompt":"Which is valid Kotlin syntax for a lambda that takes an Int x and returns x + 5?","options":["(x: Int) => x + 5","lambda x: Int { x + 5 }","{ x: Int -> x + 5 }","{ x + 5 -> x: Int }"],"correct":[2],"explanation":"Lambda parameters appear inside braces before ->. The expression after -> is the value produced by the lambda."},{"id":"M15","unit":2,"prompt":"Which composable would you choose to display a photo using a Painter parameter?","options":["Spacer","Image","Text","Surface"],"correct":[1],"explanation":"The Image composable draws image data supplied through a Painter or other supported image input."},{"id":"M16","unit":2,"prompt":"A counter should update its displayed number when the value changes. Which API produces observable Compose state?","options":["rememberResource()","mutableStateOf()","fontScale()","getDrawable()"],"correct":[1],"explanation":"mutableStateOf creates snapshot state. Reading that state in a composable lets Compose recompose when it changes."},{"id":"M17","unit":2,"prompt":"The debugger is currently stopped inside calculateTotal(). You want to complete that function and stop back at its caller. Choose the action.","options":["Step Into","Evaluate Expression","Step Out","Mute Breakpoints"],"correct":[2],"explanation":"Step Out executes the remainder of the current function and returns control to its caller."},{"id":"M18","unit":2,"prompt":"The text in a Compose screen changes automatically after a mutable state value is updated. What is this UI update process called?","options":["Recomposition","Compilation","Serialization","Resource inflation"],"correct":[0],"explanation":"Recomposition is how Compose reruns affected composable functions in response to observed state changes."},{"id":"M19","unit":2,"prompt":"A parent stores a search query and passes query plus onQueryChange to its child. Which design pattern is illustrated?","options":["Deep linking","State hoisting","Implicit intent","Dependency injection"],"correct":[1],"explanation":"State hoisting keeps state in a caller and passes the value down and events back up."},{"id":"M20","unit":2,"prompt":"A Compose UI test needs to run on an emulator. Where is the test usually stored in an Android project?","options":["src/main","src/test","src/androidTest","src/assets"],"correct":[2],"explanation":"Instrumented tests running on a device or emulator normally live under src/androidTest; src/test is for local JVM tests."},{"id":"M21","unit":3,"prompt":"Which Kotlin declaration makes a data class representing a book with title and pages properties?","options":["class data Book(title: String, pages: Int)","data class Book(val title: String, val pages: Int)","data Book(val title: String, val pages: Int)","class Book: data(val title: String, val pages: Int)"],"correct":[1],"explanation":"data class precedes the type name, and the primary constructor lists properties using val or var."},{"id":"M22","unit":3,"prompt":"Which type correctly declares a Kotlin list of strings?","options":["List[String]","List{String}","List<String>","List(String)"],"correct":[2],"explanation":"Generic type arguments in Kotlin are enclosed by angle brackets."},{"id":"M23","unit":3,"prompt":"You need to add and remove names from a collection. Which initializer is most suitable?","options":["listOf(\"Ada\")","mutableListOf(\"Ada\")","setOf(\"Ada\")","arrayOf(\"Ada\")"],"correct":[1],"explanation":"mutableListOf creates a MutableList, which supports changing contents and size."},{"id":"M24","unit":3,"prompt":"A feed may contain hundreds of vertically scrolling cards. Which composable builds items lazily?","options":["Column","Row","Box","LazyColumn"],"correct":[3],"explanation":"LazyColumn composes visible items on demand and supports large scrolling lists."},{"id":"M25","unit":3,"prompt":"Which composable presents a scrollable grid of small photographs in vertical rows?","options":["LazyHorizontalGrid","Column","LazyVerticalGrid","LazyRow"],"correct":[2],"explanation":"LazyVerticalGrid uses lazy composition to display rows in a vertical scrolling grid."},{"id":"M26","unit":3,"prompt":"An adaptive icon refers to a vector foreground drawable. Which resource file format is used for the vector definition?","options":[".xml",".mp3",".jpeg",".mp4"],"correct":[0],"explanation":"Android vector drawable resources are described with XML. Image layers can also use other supported image files."},{"id":"M27","unit":3,"prompt":"A spring animation should settle faster and feel firmer. Which two settings should you review?","options":["Padding and elevation","Damping ratio and stiffness","Font family and weight","Hue and saturation"],"correct":[1],"explanation":"Compose spring animations use dampingRatio and stiffness to describe oscillation and resistance to motion."},{"id":"M28","unit":3,"prompt":"In Material theming, which colour role is most associated with prominent, high-emphasis interface elements?","options":["surface","scrim","outline","primary"],"correct":[3],"explanation":"The primary colour role expresses prominent branded emphasis in the Material colour scheme."},{"id":"M29","unit":3,"prompt":"Which typical Compose theme file defines or applies the app-wide Material theme configuration?","options":["AndroidManifest.xml","MainActivity.kt","Theme.kt","Strings.kt"],"correct":[2],"explanation":"In common Android Studio Compose templates, Theme.kt applies the colour scheme, typography, and shapes; the filename is a convention."},{"id":"M30","unit":3,"prompt":"A meaningful chart image must be described to TalkBack users. Which parameter provides that description?","options":["contentScale","alpha","contentDescription","clip"],"correct":[2],"explanation":"contentDescription provides spoken semantic text for meaningful images; decorative images can use null."},{"id":"M31","unit":4,"prompt":"An Activity is interrupted by a dialog and no longer has user focus. Which lifecycle callback is normally triggered first?","options":["onResume()","onCreate()","onPause()","onDestroy()"],"correct":[2],"explanation":"onPause occurs when the Activity leaves the resumed/focused state, even if it remains partly visible."},{"id":"M32","unit":4,"prompt":"A small Compose form entry should survive an Activity recreation caused by device rotation. Which API is designed to save it?","options":["rememberSaveable","rememberCoroutineScope","derivedStateOf","Modifier.fillMaxSize"],"correct":[0],"explanation":"rememberSaveable saves supported values using the saved instance state mechanism, including across configuration changes."},{"id":"M33","unit":4,"prompt":"The Android architecture guidance recommends two main layers even in a simple app. Which pair?","options":["UI and data","UI and rendering only","Domain and navigation","Repository and emulator"],"correct":[0],"explanation":"The recommended app architecture has a UI layer and data layer; the domain layer is optional."},{"id":"M34","unit":4,"prompt":"A ViewModel exposes a StateFlow for a screen. Which property describes StateFlow?","options":["It stores events without any current value","It always runs only once","It has a current value and notifies collectors of state updates","It only works with XML layouts"],"correct":[2],"explanation":"StateFlow always has a current value and emits updates to collecting code."},{"id":"M35","unit":4,"prompt":"A Compose app has Home and Details destinations. Which component hosts the navigation graph and displays the selected screen?","options":["NavHost","LazyColumn","Dialog","Box"],"correct":[0],"explanation":"NavHost associates routes with destinations and shows the active destination."},{"id":"M36","unit":4,"prompt":"To open a Details destination using a NavController, which call would you make?","options":["controller.popBackStack(\"details\")","controller.navigate(\"details\")","controller.render(\"details\")","controller.start(\"details\")"],"correct":[1],"explanation":"NavController.navigate requests navigation to the named route or typed destination."},{"id":"M37","unit":4,"prompt":"A user presses Back from a detail screen and the app should return to the previous entry. Which NavController method is appropriate?","options":["openPrevious()","restartGraph()","popBackStack()","setContent()"],"correct":[2],"explanation":"popBackStack removes the top entry from the navigation back stack when a previous destination exists."},{"id":"M38","unit":4,"prompt":"A responsive layout switches between one and two columns when the available width crosses a threshold. What is that threshold called?","options":["StateFlow","Breakpoint","Composable","Saved state"],"correct":[1],"explanation":"A layout breakpoint is the size threshold where the presentation changes."},{"id":"M39","unit":4,"prompt":"For a tablet-sized medium-width window, which navigation control is commonly more appropriate than a compact bottom bar?","options":["Floating emulator","Full-screen keyboard","Navigation rail","Activity title only"],"correct":[2],"explanation":"A navigation rail takes advantage of moderate horizontal room by placing key destinations at the side."},{"id":"M40","unit":4,"prompt":"A messages app shows one conversation at a time on a phone. What is a sensible large-screen adaptation?","options":["Always use the same one-pane layout","Show conversations and selected messages side by side","Hide the conversation list permanently","Restart the Activity for every resize"],"correct":[1],"explanation":"List-detail layouts can show one pane on narrow screens and list plus detail side by side on wider screens."}];
const COURSE_TOTAL=QUIZZES.reduce((n,z)=>n+z.questions.length,0);
const STORE_KEY='android-compose-mcq-offline-v1';
let sessions={};try{sessions=JSON.parse(localStorage.getItem(STORE_KEY)||'{}')||{}}catch(e){sessions={}}
const FOUR_CHOICE_MIGRATION='android-compose-mcq-four-choice-v1';
let migrationComplete=false;try{migrationComplete=localStorage.getItem(FOUR_CHOICE_MIGRATION)==='1'}catch(e){}
if(!migrationComplete){
 const updatedIds=new Set(["Q1-2", "Q1-4", "Q1-6", "Q1-10", "Q2-7", "Q3-2", "Q3-9", "Q4-1", "Q5-2", "Q5-4", "Q6-2", "Q6-8", "Q7-2", "Q8-1", "Q9-3", "Q9-6", "Q9-11", "Q10-5", "Q10-6", "Q10-8", "Q10-10", "Q11-2", "Q11-3", "Q11-8", "Q12-4", "Q12-7", "Q12-8"]);
 for(const [quizId,s] of Object.entries(sessions)){
   if(!s||!s.answers)continue;
   let changed=false;
   for(const id of updatedIds){if(Object.prototype.hasOwnProperty.call(s.answers,id)){
      delete s.answers[id];if(s.checked)delete s.checked[id];changed=true;
   }}
   if(changed){s.finished=false;s.idx=0;}
 }
 try{localStorage.setItem(STORE_KEY,JSON.stringify(sessions));localStorage.setItem(FOUR_CHOICE_MIGRATION,'1')}catch(e){}
}
let current='home',position=0,showMissed=false;
const el=id=>document.getElementById(id);
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeAnswer=(q,indices)=>indices.map(i=>q.options[i]).join('; ')||'Not answered';
const answerHtml=(q,indices)=>indices.map(i=>esc(q.options[i])).join('; ')||'Not answered';
function groups(id){if(id==='mock')return MOCK_QUESTIONS;if(id==='all')return QUIZZES.flatMap(z=>z.questions);return QUIZZES.find(z=>String(z.id)===String(id))?.questions||[]}
function title(id){if(id==='mock')return '40-question mock exam';if(id==='all')return 'Full question bank';const z=QUIZZES.find(q=>String(q.id)===String(id));return z?`Quiz ${z.id} · ${z.title}`:'Quiz'}
function getSession(id){if(!sessions[id])sessions[id]={answers:{},checked:{},finished:false,idx:0};return sessions[id]}
function save(){try{localStorage.setItem(STORE_KEY,JSON.stringify(sessions))}catch(e){/* Browser storage may be unavailable in private browsing. */}}
function correct(q,arr){return arr.length===q.correct.length&&[...arr].sort((a,b)=>a-b).every((v,i)=>v===[...q.correct].sort((a,b)=>a-b)[i])}
function score(id){const s=getSession(id);return groups(id).filter(q=>correct(q,s.answers[q.id]||[])).length}
function countDone(id){const s=getSession(id);return groups(id).filter(q=>(s.answers[q.id]||[]).length>0).length}
function scrollTop(){window.scrollTo({top:0,behavior:'instant'})}
function scrollToQuestion(){const q=el('question-panel');if(!q)return;const target=Math.max(0,window.scrollY+q.getBoundingClientRect().top-14);window.scrollTo({top:target,behavior:'instant'})}
function navigate(id){current=String(id);position=Math.max(0,Math.min(getSession(current).idx||0,groups(current).length-1));showMissed=false;scrollTop();render()}
function saveIndex(){getSession(current).idx=position;save()}
