function choose(index,checked){const q=groups(current)[position],s=getSession(current);if(s.finished)return;let old=s.answers[q.id]||[];if(q.correct.length>1){old=checked?[...new Set([...old,index])]:old.filter(i=>i!==index)}else old=checked?[index]:[];s.answers[q.id]=old;delete s.checked[q.id];save();renderQuestion();renderProgress()}
function checkAnswer(){if(current==='mock')return;const q=groups(current)[position],s=getSession(current);if(!(s.answers[q.id]||[]).length)return;s.checked[q.id]=true;save();renderQuestion()}
function jump(i){position=i;saveIndex();render();scrollToQuestion()}
function step(d){jump(Math.max(0,Math.min(groups(current).length-1,position+d)))}
function finish(){getSession(current).finished=true;save();render();scrollTop()}
function restart(){if(!window.confirm('Start again? Previous answers for this quiz will be cleared.'))return;sessions[current]={answers:{},checked:{},finished:false,idx:0};position=0;save();render();scrollTop()}
function exportProgress(){const data={exportedAt:new Date().toISOString(),sectionPracticeQuestions:COURSE_TOTAL,mockExamQuestions:MOCK_QUESTIONS.length,sessions};const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='mobile-applications-quiz-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function sidebar(){let h=`<div class="brand"><span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span><div><strong>Mobile Applications</strong><small>MCQ Practice</small></div></div><div class="quick-nav"><button class="nav-button ${current==='home'?'active':''}" data-action="nav" data-id="home"><span class="symbol">⌂</span> Dashboard</button><button class="nav-button ${current==='mock'?'active':''}" data-action="nav" data-id="mock"><span class="symbol">40</span> Mock exam</button></div>`;
 for(let u=1;u<=4;u++){h+=`<div class="nav-label">Section ${u}</div>`;for(const q of QUIZZES.filter(z=>z.unit===u)){h+=`<button class="nav-button quiz-nav ${current===String(q.id)?'active':''}" data-action="nav" data-id="${q.id}"><span class="symbol">${q.id}</span><span class="nav-text">${esc(q.title)}</span></button>`}}
 el('sidebar').innerHTML=h}
function topbar(text='Mobile Applications · MCQ Practice'){return `<div class="topline"><span class="eyebrow">${esc(text)}</span><button class="btn btn-outline btn-small" data-action="export">Export progress</button></div>`}
function home(){let h=topbar('Sections 1–4 · Jetpack Compose');h+=`<section class="hero"><div class="hero-label">Mobile Applications · Revision</div><h1>Practice with confidence.</h1><p>Choose an individual quiz to revise a topic, or test your understanding in a 40-question mock examination.</p><div class="hero-actions"><button class="btn btn-light" data-action="nav" data-id="mock">Take the mock exam <span aria-hidden="true">→</span></button><button class="btn btn-outline" data-action="scroll-quizzes">Individual quizzes <span aria-hidden="true">↓</span></button></div></section>`;
 h+=`<section class="section"><div class="section-heading"><div><h2>Sections 1–4</h2><p class="subtext">Three individual quizzes per section</p></div></div><div class="section-grid">`;
 const labels=['Kotlin & Compose basics','Kotlin, state & interactivity','Lists, styling & accessibility','Architecture & navigation'];
 for(let u=1;u<=4;u++){const qs=QUIZZES.filter(z=>z.unit===u);const n=qs.reduce((s,z)=>s+z.questions.length,0);h+=`<article class="section-card"><span class="smalltag">Section ${u}</span><h3>${labels[u-1]}</h3><p>${n} practice questions · 3 quizzes</p><button class="btn btn-outline btn-small" data-action="nav" data-id="${qs[0].id}">Start section ${u} →</button></article>`}
 h+=`</div></section><section class="section" id="individual-quizzes"><div class="section-heading"><div><h2>Individual Quizzes</h2><p class="subtext">Select a quiz and review explanations as you go</p></div><button class="btn btn-outline btn-small" data-action="nav" data-id="all">Practice all ${COURSE_TOTAL}</button></div><div class="quiz-grid">`;
 for(const z of QUIZZES){const s=getSession(z.id),done=countDone(z.id),mark=s.finished?`Score ${score(z.id)}/${z.questions.length}`:`${done} of ${z.questions.length} answered`;h+=`<article class="quiz-card"><div><strong>Quiz ${z.id} · ${esc(z.title)}</strong><p>Section ${z.unit} · ${mark}</p></div><button class="btn btn-${s.finished?'outline':'teal'} btn-small" data-action="nav" data-id="${z.id}">${s.finished?'Review':'Open'}</button></article>`}
 h+=`</div></section><section class="section"><div class="section-heading"><div><h2>Mock Examination</h2><p class="subtext">Exam-style revision using new questions across all four sections</p></div></div><article class="mock-card"><div><h3>40 questions · 20 marks</h3><p>Four options per question. One correct answer. Answers and explanations appear after submission.</p></div><button class="btn btn-primary" data-action="nav" data-id="mock">${getSession('mock').finished?'Review mock':'Start mock exam'}</button></article></section>`;
 return h}
function progressPanel(){const qs=groups(current),s=getSession(current),done=countDone(current),pct=Math.round(done/qs.length*100);let h=`<div class="progress-panel" id="progress-panel"><div class="progress-labels"><span>${s.finished?'Completed':`Answered ${done} of ${qs.length}`}</span><span>${pct}% answered</span></div><div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div><div class="question-dots" aria-label="Question navigation">`;
 qs.forEach((q,i)=>{const answered=(s.answers[q.id]||[]).length;h+=`<button type="button" class="dot ${i===position&&!s.finished?'current':''} ${answered?'done':''}" aria-label="Go to question ${i+1}${answered?', answered':''}" data-action="jump" data-index="${i}" ${s.finished?'disabled':''}>${i+1}</button>`});return h+'</div></div>'}
function quizHeader(){const n=groups(current).length,s=getSession(current);let sub=current==='mock'?'40 questions · 20 marks · one answer per question':current==='all'?`${n} questions · all four sections`:`Section ${QUIZZES.find(z=>String(z.id)===current).unit} · ${n} practice questions`;
 return topbar(current==='mock'?'Mock Examination':current==='all'?'All sections':`Section ${QUIZZES.find(z=>String(z.id)===current).unit} · Individual Quiz`)+`<div class="quiz-header"><div><h1>${esc(title(current))}</h1><p>${sub}</p></div><button class="btn btn-danger btn-small" data-action="restart">Start again</button></div>`}
function questionPanel(){const qs=groups(current),q=qs[position],s=getSession(current),selected=s.answers[q.id]||[],revealed=current!=='mock'&&!!s.checked[q.id],passed=correct(q,selected);let label=q.correct.length>1?'Select all that apply':'Select one answer';
 let h=`<article class="question-panel" id="question-panel"><div class="qmeta"><span class="qnumber">QUESTION ${position+1} / ${qs.length}</span><span class="tag">${label}</span></div><h2>${esc(q.prompt)}</h2><fieldset style="margin:0;padding:0;border:0;min-width:0"><legend class="sr-only">Answer choices</legend><div class="answer-list">`;
 q.options.forEach((option,i)=>{const checked=selected.includes(i),status=revealed?(q.correct.includes(i)?'correct':checked?'wrong':''):'';h+=`<label class="answer-choice ${checked?'selected':''} ${status}"><input type="${q.correct.length>1?'checkbox':'radio'}" name="question-${esc(q.id)}" data-answer="${i}" value="${i}" ${checked?'checked':''} ${s.finished?'disabled':''}><span class="option-letter">${String.fromCharCode(65+i)}</span><span class="answer-text">${esc(option)}</span></label>`});h+='</div></fieldset>';
 if(revealed){h+=`<div role="status" class="feedback ${passed?'':'wrong'}"><strong>${passed?'✓ Correct answer':'✕ Review this answer'}</strong><div><b>Answer:</b> ${answerHtml(q,q.correct)}</div><p>${esc(q.explanation)}</p></div>`}
 h+=`<div class="actions"><div class="group"><button class="btn btn-outline" data-action="prev" ${position===0?'disabled':''}>← Previous</button><button class="btn btn-outline" data-action="next" ${position===qs.length-1?'disabled':''}>Next →</button></div><div class="group">${current==='mock'?'':`<button class="btn btn-outline" data-action="check" ${!selected.length||revealed?'disabled':''}>Check answer</button>`}<button class="btn btn-primary" data-action="finish">${current==='mock'?'Submit exam':'Finish & score'}</button></div></div>`;
 if(current==='mock')h+='<p class="muted-note">This mock is scored when you submit. You can review the correct answers afterwards.</p>';
 return h+'</article>'}
function resultPanel(){const qs=groups(current),s=getSession(current),right=score(current),unanswered=qs.length-countDone(current),percent=Math.round(right/qs.length*100),list=showMissed?qs.filter(q=>!correct(q,s.answers[q.id]||[])):qs;
 let h=`<section class="result-panel"><div class="eyebrow">${current==='mock'?'Mock examination results':'Practice results'}</div><div class="score">${right} / ${qs.length}</div><p><b>${percent}% correct</b> · ${unanswered} unanswered</p>${current==='mock'?`<p><b>${(right*.5).toFixed(1)} / 20 marks</b></p>`:''}<p>Review your answers and the explanations below, or retake this quiz.</p><div class="actions"><div class="group"><button class="btn ${!showMissed?'btn-primary':'btn-outline'} btn-small" data-action="reviewall">Review all</button><button class="btn ${showMissed?'btn-primary':'btn-outline'} btn-small" data-action="reviewmissed">Review missed (${qs.length-right})</button></div><div class="group"><button class="btn btn-outline btn-small" data-action="export">Export progress</button><button class="btn btn-danger btn-small" data-action="restart">Retake</button></div></div></section><div class="review-list">`;
 for(const q of list){const chosen=s.answers[q.id]||[],good=correct(q,chosen),status=good?'Correct':chosen.length?'Incorrect':'Unanswered',index=qs.indexOf(q)+1;h+=`<article class="review-card"><header><h3>Q${index}. ${esc(q.prompt)}</h3><span class="tag ${good?'correct-tag':'wrong-tag'}">${status}</span></header><p><b>Your answer:</b> <span class="${good?'solution':'wrong-text'}">${answerHtml(q,chosen)}</span></p><p><b>Correct answer:</b> <span class="solution">${answerHtml(q,q.correct)}</span></p><p><b>Explanation:</b> ${esc(q.explanation)}</p></article>`}
 return h+(list.length?'':'<div class="empty">Excellent — no missed questions in this attempt.</div>')+'</div>'}
function render(){sidebar();el('app').classList.toggle('is-answering',current!=='home'&&!getSession(current).finished);el('app').innerHTML=current==='home'?home():quizHeader()+progressPanel()+(getSession(current).finished?resultPanel():questionPanel())}
function renderQuestion(){const q=el('question-panel');if(q)q.outerHTML=questionPanel()}
function renderProgress(){const p=el('progress-panel');if(p)p.outerHTML=progressPanel()}
document.addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(!b||b.disabled)return;const action=b.dataset.action;switch(action){case'nav':navigate(b.dataset.id);break;case'scroll-quizzes':el('individual-quizzes')?.scrollIntoView({behavior:'smooth'});break;case'jump':if(!getSession(current).finished)jump(Number(b.dataset.index));break;case'prev':step(-1);break;case'next':step(1);break;case'check':checkAnswer();break;case'finish':finish();break;case'restart':restart();break;case'reviewall':showMissed=false;render();break;case'reviewmissed':showMissed=true;render();break;case'export':exportProgress();break}});
document.addEventListener('change',e=>{const inp=e.target.closest('input[data-answer]');if(inp&&current!=='home')choose(Number(inp.dataset.answer),inp.checked)});
render();
</script>
</body>
</html>
